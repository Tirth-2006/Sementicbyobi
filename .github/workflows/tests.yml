name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Default CI is offline: no model weights or datasets are downloaded.
# Real Qwen/DeBERTa/TriviaQA checks live in manual_checks/ and are never run here.
env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm tests are actually collected
        run: |
          count=$(python -m pytest --collect-only -q | grep -c "::")
          echo "Collected $count tests"
          test "$count" -ge 50
      - name: Run unit tests
        run: python -m pytest -q

  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel in a clean environment and import outside the repo
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" - <<'PY'
          import importlib, sys
          for name in [
              "uncertainty", "uncertainty.config",
              "uncertainty.semantic.clustering", "uncertainty.semantic.semantic_entropy",
              "uncertainty.evaluation.correctness", "uncertainty.evaluation.metrics",
              "uncertainty.evaluation.predictive_probes",
              "uncertainty.evaluation.selective_prediction",
              "uncertainty.hidden_states.dispersion", "uncertainty.hidden_states.extraction",
              "uncertainty.token_uncertainty.predictive_entropy",
              "uncertainty.token_uncertainty.teacher_forcing",
              "uncertainty.utils.alignment", "uncertainty.utils.provenance",
          ]:
              importlib.import_module(name)
          try:
              importlib.import_module("scripts")
          except ModuleNotFoundError:
              pass
          else:
              sys.exit("package unexpectedly exposes the scripts/ directory")
          print("clean-install imports OK")
          PY
