[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-entropy-hallucination-detection"
version = "0.1.0"
description = "Semantic, token, and hidden-state uncertainty experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Local model experiments (CUDA-capable PyTorch must be installed for your platform).
models = [
    "torch>=2.0",
    "transformers>=4.51",
    "accelerate>=0.20",
    "bitsandbytes>=0.41",
    "datasets>=2.14",
    "tqdm>=4.65",
]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only ``src`` is on the path: the package must not need scripts/ or the repo root.
pythonpath = ["src"]
addopts = "-ra"
